  .shot.leaving .word { animation:wordOut .26s ease-in both !important; }

  .shot.normal .word { font-size:clamp(34px,6.5vw,84px);

  /* drum accents, velocity-scaled */
  .word.bang.acc-kick  { animation:slam .3s ease-out !important; }
  .word.bang.acc-snare { animation:snap .2s ease-out !important; }
  .word.bang.acc-hat   { animation:shimmer .16s ease-out !important; }
  @keyframes slam { 0%{transform:translateY(var(--lift)) scale(1.6);}
    100%{transform:translateY(var(--lift)) scale(1);} }
  @keyframes snap { 0%{transform:translateY(var(--lift)) skewX(10deg) scale(1.35);
      text-shadow:0 0 24px #fff, 0 0 70px hsl(var(--vhue) 95% 65%);}
    100%{transform:translateY(var(--lift)) skewX(0) scale(1);} }
  @keyframes shimmer { 0%{opacity:.35;} 100%{opacity:1;} }
  /* laugh: fullscreen joker */
  .shot.laugh.on { animation:shotIn .5s cubic-bezier(.2,1.4,.3,1) both; }
  @keyframes shotIn { from{opacity:0; transform:scale(.7);} to{opacity:1; transform:scale(1);} }
  .shot.laugh .word { font-size:clamp(90px,21vw,300px); font-weight:900; font-style:italic;
    color:#b6ff2e; opacity:1;
    text-shadow:0 0 24px #7a00ff, 0 0 90px #7a00ff, 0 6px 0 #2a0050, 0 10px 24px #000;
    animation:joker .42s infinite !important; }
  @keyframes joker {
    0%,100% { transform:rotate(-3deg) translate(0,0) scale(1); }
    25% { transform:rotate(-1deg) translate(7px,-9px) scale(1.05); }
    50% { transform:rotate(-4.5deg) translate(-8px,6px) scale(.97); }
    75% { transform:rotate(-2deg) translate(6px,8px) scale(1.03); } }
  .shot.laugh.leaving .word { animation:wordOut .26s ease-in both !important; }
  /* hook: owns the entire screen */
  .shot.hook.on { animation:shotIn .45s cubic-bezier(.2,1.4,.3,1) both; }
  .shot.hook .words { flex-direction:column; gap:.05em; }
  .shot.hook .word { font-size:clamp(64px,15.5vw,210px); font-weight:900;
    letter-spacing:.03em; line-height:1.02; opacity:1; color:#fff;
    text-shadow:0 0 20px hsl(var(--vhue) 95% 62%),

                0 6px 10px #000;
    -webkit-text-stroke:2px hsl(var(--vhue) 90% 30% / .8); }
  .shot.hook.leaving .word { animation:wordOut .3s ease-in both !important; }

    font-family:ui-monospace,Menlo,monospace; font-size:11px;
    letter-spacing:.35em; text-transform:uppercase; opacity:.5; }
  #bassbar { position:fixed; left:0; bottom:0; height:7px; width:100%; z-index:2;
    background:linear-gradient(90deg, hsl(var(--bhue,0) 95% 55%), hsl(calc(var(--bhue,0) + 40) 95% 45%));
    transform-origin:left center; transform:scaleX(0); opacity:.9; }
  #prog { position:fixed; top:0; left:0; height:3px; width:100%; z-index:4; background:#ffffff14; }
  #prog i { display:block; height:100%; width:0; background:linear-gradient(90deg,#ff5d5d,#ffb35d); }
  #ctl { position:fixed; bottom:22px; left:50%; transform:translateX(-50%); z-index:5;
    display:flex; gap:10px; align-items:center;
    font-family:ui-monospace,Menlo,monospace; font-size:12px; }
  #ctl button { background:#ffffff14; color:#f5f2ea; border:1px solid #ffffff2c;
    border-radius:8px; padding:8px 14px; cursor:pointer; }
  #t { opacity:.6; }

    }
  }
  // stage + bass bar follow the active word
  let w = null;
  for (let i = WORDS.length - 1; i >= 0; i--) {
    if (ms >= WORDS[i].s && ms < WORDS[i].e) { w = WORDS[i]; break; }
  }
  const sh = SHOTS[curShot];
  if (w) {
    stageTarget = (sh && sh.kind === 'hook') ? w.vhue : w.bhue;
    pulse = Math.max(pulse, w.bvel);
  } else pulse *= 0.92;
  let d = stageTarget - stageHue;
  d = ((d + 540) % 360) - 180;
  stageHue = (stageHue + d * 0.06 + 360) % 360;
  stage.style.background =
    `radial-gradient(ellipse at 50% 115%, hsl(${stageHue.toFixed(1)} 65% ${10 + pulse*10}%), #050507 72%)`;
  bassbar.style.setProperty('--bhue', (w ? w.bhue : stageHue).toFixed(0));
  bassbar.style.transform = `scaleX(${pulse.toFixed(3)})`;
  pulse *= 0.94;
  const lastE = SHOTS.length ? SHOTS[SHOTS.length-1].e : 1;
  bar.style.width = Math.min(100, ms / lastE * 100) + '%';
  const s2 = Math.floor(au.currentTime);
  tEl.textContent = Math.floor(s2/60) + ':' + String(s2%60).padStart(2,'0');
  requestAnimationFrame(tick);
}
document.getElementById('play').onclick = () => {
  if (au.paused) { au.play(); document.getElementById('play').textContent = '⏸ pause'; }
  else { au.pause(); document.getElementById('play').textContent = '▶ play'; }
};
document.getElementById('pick').onclick = () =>
  document.getElementById('file').click();
document.getElementById('file').onchange = e => {
  au.src = URL.createObjectURL(e.target.files[0]);
};
au.addEventListener('ended', () =>
  document.getElementById('play').textContent = '▶ play');
au.addEventListener('seeked', () => { banged.clear(); curShot = -2; });
requestAnimationFrame(tick);
</script></body></html>
