  #mood { font-family: ui-monospace, Menlo, monospace; font-size:11px;

  #line { min-height:34vh; display:flex; align-items:center; justify-content:center;
    flex-wrap:wrap; gap:.28em; padding:0 4vw; }
  .word { --vhue:0; --lift:0px; --avel:.6;
    display:inline-block; opacity:.16; filter:blur(1px);
    transform:translateY(var(--lift)) scale(.94);
    transition:opacity .12s, filter .12s, transform .16s ease-out; }
  .word.active { opacity:1; filter:none;
    transform:translateY(var(--lift)) scale(1.22);
    color:#fff;
    text-shadow:0 0 14px hsl(var(--vhue) 95% 62%),
                0 0 46px hsl(var(--vhue) 90% 50% / .8),
                0 2px 6px #000; }
  .word.spoken { opacity:.75; filter:none; transform:translateY(var(--lift)) scale(1.02); }
  /* drum-differentiated accents, velocity-scaled via --avel */
  .word.acc-kick.active    { animation:slam calc(.34s - var(--avel)*.1s) ease-out; }
  .word.acc-snare.active   { animation:snap .2s ease-out; }
  .word.acc-hat.active     { animation:shimmer .16s ease-out; }
  @keyframes slam { 0%{transform:translateY(var(--lift)) scale(1.55);}
    60%{transform:translateY(var(--lift)) scale(calc(1.22 - var(--avel)*.06));}
    100%{transform:translateY(var(--lift)) scale(1.22);} }
  @keyframes snap { 0%{transform:translateY(var(--lift)) skewX(9deg) scale(1.3);
      text-shadow:0 0 22px #fff, 0 0 60px hsl(var(--vhue) 95% 65%);}
    100%{transform:translateY(var(--lift)) skewX(0) scale(1.22);} }
  @keyframes shimmer { 0%{opacity:.4;} 100%{opacity:1;} }
  /* mood sizing (kept from v1) */
  #line.m-intro  .word { font-size:clamp(28px,5vw,54px); font-style:italic; }
  #line.m-verse  .word { font-size:clamp(30px,5.4vw,58px); }
  #line.m-verse2 .word { font-size:clamp(30px,5.4vw,58px); letter-spacing:.02em; }
  #line.m-hit    .word { font-size:clamp(40px,7.4vw,84px); font-weight:700; }
  #line.m-chorus .word { font-size:clamp(44px,8vw,92px); font-weight:800;
    letter-spacing:.04em; }
  #line.m-pre    .word { font-size:clamp(26px,4.6vw,48px); opacity:.16; }
  #line.m-end    .word { font-size:clamp(34px,6vw,66px); font-style:italic; }
  /* bass bar: pulses with the bassline, colored by bass pitch class */
  #bassbar { position:fixed; left:0; bottom:0; height:7px; width:100%; z-index:2;
    background:linear-gradient(90deg, hsl(var(--bhue,0) 95% 55%), hsl(calc(var(--bhue,0) + 40) 95% 45%));
    transform-origin:left center; transform:scaleX(0); opacity:.9; }
  #prog { position:fixed; top:0; left:0; height:3px; width:100%; z-index:4;
    background:#ffffff14; }
  #prog i { display:block; height:100%; width:0;
    background:linear-gradient(90deg,#ff5d5d,#ffb35d); }
  #ctl { position:fixed; bottom:22px; left:50%; transform:translateX(-50%);
    z-index:5; display:flex; gap:10px; align-items:center;
    font-family:ui-monospace,Menlo,monospace; font-size:12px; }
  #ctl button { background:#ffffff14; color:#f5f2ea; border:1px solid #ffffff2c;
    border-radius:8px; padding:8px 14px; cursor:pointer; }
  #t { opacity:.6; }
  #melody { position:fixed; right:14px; top:50%; transform:translateY(-50%);
    z-index:2; font-family:ui-monospace,Menlo,monospace; font-size:10px;
